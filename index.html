<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vibe.Music</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
            image-rendering: pixelated;
        }

        .welcome-screen {
            text-align: center;
            max-width: 500px;
            animation: fadeIn 0.8s ease;
        }

        .welcome-screen.hidden {
            display: none;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 40px;
            animation: float 3s ease-in-out infinite;
        }

        .app-title {
            font-size: 24px;
            margin-bottom: 60px;
            letter-spacing: 2px;
        }

        .welcome-text {
            font-size: 10px;
            line-height: 2;
            margin-bottom: 40px;
            color: #666;
        }

        .player {
            width: 100%;
            max-width: 900px;
            background: #111;
            border: 3px solid #333;
            padding: 40px;
            display: none;
            animation: fadeIn 0.8s ease;
        }

        .player.active {
            display: block;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #222;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            font-size: 32px;
            animation: float 3s ease-in-out infinite;
        }

        .brand-name {
            font-size: 14px;
            letter-spacing: 1px;
        }

        .settings-btn {
            background: none;
            border: 2px solid #333;
            color: #666;
            padding: 8px 16px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            border-color: #fff;
            color: #fff;
        }

        .settings-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .visualizer-container {
            height: 180px;
            margin-bottom: 40px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            border: 2px solid #222;
            padding: 10px;
            background: #0a0a0a;
        }

        .bar {
            width: 6px;
            background: #fff;
            opacity: 0;
            animation: barFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            image-rendering: pixelated;
        }

        @keyframes barFadeIn {
            from {
                opacity: 0;
                transform: scaleY(0);
            }
            to {
                opacity: 1;
                transform: scaleY(1);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .track-info {
            text-align: center;
            margin-bottom: 40px;
            min-height: 80px;
        }

        .track-title {
            font-size: 16px;
            margin-bottom: 15px;
            line-height: 1.5;
            word-break: break-word;
        }

        .track-artist {
            font-size: 8px;
            color: #666;
            line-height: 1.8;
        }

        .progress-container {
            margin-bottom: 40px;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #222;
            cursor: pointer;
            position: relative;
            margin-bottom: 15px;
            border: 2px solid #333;
        }

        .progress {
            height: 100%;
            background: #fff;
            width: 0%;
            transition: width 0.1s linear;
            image-rendering: pixelated;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #666;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
        }

        .control-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #fff;
            transition: all 0.3s ease;
            padding: 10px;
            position: relative;
        }

        .control-btn:hover {
            transform: scale(1.1);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn svg {
            width: 32px;
            height: 32px;
            stroke-width: 3;
        }

        .play-btn svg {
            width: 48px;
            height: 48px;
        }

        .settings-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            margin-bottom: 20px;
        }

        .settings-panel.open {
            max-height: 500px;
        }

        .settings-content {
            border: 2px solid #222;
            padding: 30px;
            background: #0a0a0a;
        }

        .setting-section {
            margin-bottom: 30px;
        }

        .setting-section:last-child {
            margin-bottom: 0;
        }

        .setting-title {
            font-size: 10px;
            color: #666;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .volume-icon {
            font-size: 16px;
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 8px;
            background: #222;
            outline: none;
            cursor: pointer;
            border: 2px solid #333;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            cursor: pointer;
            border: 2px solid #000;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            background: #ddd;
        }

        .eq-sliders {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .eq-band {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .eq-slider-container {
            height: 120px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .eq-slider {
            -webkit-appearance: none;
            width: 120px;
            height: 8px;
            background: #222;
            outline: none;
            transform: rotate(-90deg);
            cursor: pointer;
            border: 2px solid #333;
        }

        .eq-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            cursor: pointer;
            border: 2px solid #000;
        }

        .eq-slider::-webkit-slider-thumb:hover {
            background: #ddd;
        }

        .eq-label {
            font-size: 8px;
            color: #666;
        }

        .eq-toggle {
            background: none;
            border: 2px solid #333;
            color: #666;
            padding: 6px 14px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .eq-toggle:hover {
            border-color: #666;
            color: #fff;
        }

        .eq-toggle.active {
            border-color: #fff;
            background: #fff;
            color: #000;
        }

        .playlist {
            max-height: 300px;
            overflow-y: auto;
            border: 2px solid #222;
            background: #0a0a0a;
        }

        .playlist::-webkit-scrollbar {
            width: 12px;
        }

        .playlist::-webkit-scrollbar-track {
            background: #111;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: #333;
        }

        .playlist-item {
            padding: 16px 20px;
            background: transparent;
            border-bottom: 1px solid #151515;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            transform: translateX(-20px);
        }

        .playlist-item.fade-in {
            opacity: 1;
            transform: translateX(0);
        }

        .playlist-item:hover {
            background: #151515;
            border-left-color: #666;
        }

        .playlist-item.active {
            background: #151515;
            border-left-color: #fff;
        }

        .playlist-number {
            font-size: 10px;
            color: #666;
            width: 30px;
        }

        .playlist-item:hover .playlist-number,
        .playlist-item.active .playlist-number {
            color: #fff;
        }

        .playlist-name {
            font-size: 10px;
            flex: 1;
            line-height: 1.6;
            word-break: break-word;
        }

        .playlist-artist {
            font-size: 8px;
            color: #666;
            margin-top: 8px;
            line-height: 1.6;
        }

        .file-input-btn {
            padding: 16px 32px;
            background: transparent;
            color: #fff;
            border: 3px solid #333;
            cursor: pointer;
            width: 100%;
            text-align: center;
            font-size: 10px;
            font-family: 'Press Start 2P', cursive;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .file-input-btn:hover {
            border-color: #fff;
            background: #fff;
            color: #000;
        }

        .drop-zone {
            border: 3px dashed #333;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #0a0a0a;
        }

        .drop-zone:hover {
            border-color: #666;
        }

        .drop-zone.dragover {
            border-color: #fff;
            background: #151515;
        }

        .drop-zone-text {
            font-size: 10px;
            color: #666;
            line-height: 2;
        }

        .clear-btn {
            padding: 12px 24px;
            background: transparent;
            color: #666;
            border: 2px solid #333;
            cursor: pointer;
            font-size: 8px;
            font-family: 'Press Start 2P', cursive;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
        }

        .clear-btn:hover {
            border-color: #f44;
            color: #f44;
        }
    </style>
</head>
<body>
    <div class="welcome-screen" id="welcomeScreen">
        <div class="logo">👾</div>
        <div class="app-title">vibe.Music</div>
        <div class="welcome-text">
            ПЕРЕТАЩИТЕ ТРЕКИ<br>
            ИЛИ<br>
            НАЖМИТЕ ДЛЯ ЗАГРУЗКИ
        </div>
        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-text">📂 ВЫБРАТЬ ФАЙЛЫ</div>
        </div>
    </div>

    <div class="player" id="player">
        <div class="header">
            <div class="brand">
                <div class="brand-logo">👾</div>
                <div class="brand-name">vibe.Music</div>
            </div>
            <button class="settings-btn" id="settingsBtn">НАСТРОЙКИ</button>
        </div>

        <div class="settings-panel" id="settingsPanel">
            <div class="settings-content">
                <div class="setting-section">
                    <div class="setting-title">ГРОМКОСТЬ</div>
                    <div class="volume-container">
                        <div class="volume-icon">🔊</div>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
                    </div>
                </div>

                <div class="setting-section">
                    <div class="setting-title">ЭКВАЛАЙЗЕР</div>
                    <button class="eq-toggle" id="eqToggle">ВЫКЛ</button>
                    <div class="eq-sliders">
                        <div class="eq-band">
                            <div class="eq-slider-container">
                                <input type="range" class="eq-slider" min="-12" max="12" value="0" step="0.1" data-freq="60">
                            </div>
                            <div class="eq-label">60</div>
                        </div>
                        <div class="eq-band">
                            <div class="eq-slider-container">
                                <input type="range" class="eq-slider" min="-12" max="12" value="0" step="0.1" data-freq="170">
                            </div>
                            <div class="eq-label">170</div>
                        </div>
                        <div class="eq-band">
                            <div class="eq-slider-container">
                                <input type="range" class="eq-slider" min="-12" max="12" value="0" step="0.1" data-freq="350">
                            </div>
                            <div class="eq-label">350</div>
                        </div>
                        <div class="eq-band">
                            <div class="eq-slider-container">
                                <input type="range" class="eq-slider" min="-12" max="12" value="0" step="0.1" data-freq="1000">
                            </div>
                            <div class="eq-label">1K</div>
                        </div>
                        <div class="eq-band">
                            <div class="eq-slider-container">
                                <input type="range" class="eq-slider" min="-12" max="12" value="0" step="0.1" data-freq="3500">
                            </div>
                            <div class="eq-label">3.5K</div>
                        </div>
                        <div class="eq-band">
                            <div class="eq-slider-container">
                                <input type="range" class="eq-slider" min="-12" max="12" value="0" step="0.1" data-freq="10000">
                            </div>
                            <div class="eq-label">10K</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="visualizer-container" id="visualizer"></div>

        <div class="track-info">
            <div class="track-title" id="trackTitle">Выберите трек</div>
            <div class="track-artist" id="trackArtist">---</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="time-info">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn" id="prevBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <polygon points="19 20 9 12 19 4 19 20"></polygon>
                    <line x1="5" y1="19" x2="5" y2="5"></line>
                </svg>
            </button>

            <button class="control-btn play-btn" id="playBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3" id="playIcon"></polygon>
                    <line x1="6" y1="4" x2="6" y2="20" id="pauseLeft" style="display:none"></line>
                    <line x1="18" y1="4" x2="18" y2="20" id="pauseRight" style="display:none"></line>
                </svg>
            </button>

            <button class="control-btn" id="nextBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <polygon points="5 4 15 12 5 20 5 4"></polygon>
                    <line x1="19" y1="5" x2="19" y2="19"></line>
                </svg>
            </button>
        </div>

        <div class="playlist" id="playlist"></div>

        <input type="file" id="fileInput" accept="audio/*" multiple style="display: none;">
        <button class="file-input-btn" onclick="document.getElementById('fileInput').click()">
            + ДОБАВИТЬ ТРЕКИ
        </button>

        <button class="clear-btn" id="clearBtn">ОЧИСТИТЬ ВСЕ</button>
    </div>

    <audio id="audio"></audio>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseLeft = document.getElementById('pauseLeft');
        const pauseRight = document.getElementById('pauseRight');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const fileInput = document.getElementById('fileInput');
        const playlistEl = document.getElementById('playlist');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const visualizer = document.getElementById('visualizer');
        const eqToggle = document.getElementById('eqToggle');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const playerEl = document.getElementById('player');
        const dropZone = document.getElementById('dropZone');
        const clearBtn = document.getElementById('clearBtn');

        let playlist = [];
        let currentTrackIndex = 0;
        let audioContext;
        let analyser;
        let source;
        let eqFilters = [];
        let eqEnabled = false;

        for (let i = 0; i < 40; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = '4px';
            bar.style.animationDelay = `${i * 0.02}s`;
            visualizer.appendChild(bar);
        }

        const bars = visualizer.querySelectorAll('.bar');

        loadPlaylist();

        if (playlist.length > 0) {
            showPlayer();
        }

        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('open');
            settingsBtn.classList.toggle('active');
        });

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));
            if (files.length > 0) {
                handleFiles(files);
            }
        });

        playerEl.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        playerEl.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/'));
            if (files.length > 0) {
                handleFiles(files);
            }
        });

        function showPlayer() {
            welcomeScreen.classList.add('hidden');
            playerEl.classList.add('active');
        }

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 128;

                source = audioContext.createMediaElementSource(audio);

                const frequencies = [60, 170, 350, 1000, 3500, 10000];
                frequencies.forEach(freq => {
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'peaking';
                    filter.frequency.value = freq;
                    filter.Q.value = 1;
                    filter.gain.value = 0;
                    eqFilters.push(filter);
                });

                let currentNode = source;
                eqFilters.forEach(filter => {
                    currentNode.connect(filter);
                    currentNode = filter;
                });

                currentNode.connect(analyser);
                analyser.connect(audioContext.destination);

                document.querySelectorAll('.eq-slider').forEach((slider, index) => {
                    slider.addEventListener('input', (e) => {
                        if (eqEnabled) {
                            eqFilters[index].gain.value = parseFloat(e.target.value);
                        }
                    });
                });
            }
        }

        eqToggle.addEventListener('click', () => {
            eqEnabled = !eqEnabled;
            eqToggle.textContent = eqEnabled ? 'ВКЛ' : 'ВЫКЛ';
            eqToggle.classList.toggle('active');

            if (!eqEnabled) {
                eqFilters.forEach(filter => filter.gain.value = 0);
                document.querySelectorAll('.eq-slider').forEach(slider => slider.value = 0);
            }
        });

        function animate() {
            requestAnimationFrame(animate);

            if (!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            bars.forEach((bar, i) => {
                const index = Math.floor(i * bufferLength / bars.length);
                const value = dataArray[index];
                const height = (value / 255) * 160;
                bar.style.height = Math.max(4, height) + 'px';
            });
        }

        animate();

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            await handleFiles(files);
        });

        async function handleFiles(files) {
            for (const file of files) {
                const url = URL.createObjectURL(file);
                const metadata = await extractMetadata(file, url);

                playlist.push({
                    name: metadata.title || file.name.replace(/\.[^/.]+$/, ''),
                    artist: metadata.artist || '---',
                    file: file,
                    url: url
                });
            }

            savePlaylist();

            if (playlist.length > 0) {
                showPlayer();
                loadTrack(currentTrackIndex);
                renderPlaylist();
            }
        }

        async function extractMetadata(file, url) {
            return new Promise((resolve) => {
                const tempAudio = new Audio(url);

                tempAudio.addEventListener('loadedmetadata', () => {
                    resolve({ title: null, artist: null });
                });

                tempAudio.addEventListener('error', () => {
                    resolve({ title: null, artist: null });
                });
            });
        }

        function loadTrack(index) {
            if (playlist.length === 0) return;

            currentTrackIndex = index;
            const track = playlist[index];
            audio.src = track.url;
            trackTitle.textContent = track.name;
            trackArtist.textContent = track.artist;

            renderPlaylist();
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item' + (index === currentTrackIndex ? ' active' : '');

                const number = document.createElement('div');
                number.className = 'playlist-number';
                number.textContent = String(index + 1).padStart(2, '0');

                const textContainer = document.createElement('div');
                textContainer.style.flex = '1';

                const name = document.createElement('div');
                name.className = 'playlist-name';
                name.textContent = track.name;

                const artist = document.createElement('div');
                artist.className = 'playlist-artist';
                artist.textContent = track.artist;

                textContainer.appendChild(name);
                textContainer.appendChild(artist);

                item.appendChild(number);
                item.appendChild(textContainer);

                item.addEventListener('click', () => {
                    loadTrack(index);
                    play();
                });

                playlistEl.appendChild(item);

                setTimeout(() => {
                    item.classList.add('fade-in');
                }, index * 30);
            });
        }

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                play();
            } else {
                pause();
            }
        });

        function play() {
            if (playlist.length === 0) return;

            initAudioContext();
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            audio.play();
            playIcon.style.display = 'none';
            pauseLeft.style.display = 'block';
            pauseRight.style.display = 'block';
        }

        function pause() {
            audio.pause();
            playIcon.style.display = 'block';
            pauseLeft.style.display = 'none';
            pauseRight.style.display = 'none';
        }

        prevBtn.addEventListener('click', () => {
            if (currentTrackIndex > 0) {
                loadTrack(currentTrackIndex - 1);
                play();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentTrackIndex < playlist.length - 1) {
                loadTrack(currentTrackIndex + 1);
                play();
            }
        });

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progress.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            if (currentTrackIndex < playlist.length - 1) {
                loadTrack(currentTrackIndex + 1);
                play();
            } else {
                pause();
            }
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value / 100;
        });

        audio.volume = 0.7;

        clearBtn.addEventListener('click', () => {
            if (confirm('Удалить все треки?')) {
                playlist = [];
                currentTrackIndex = 0;
                audio.pause();
                audio.src = '';
                localStorage.removeItem('vibeMusic_playlist');
                playerEl.classList.remove('active');
                welcomeScreen.classList.remove('hidden');
            }
        });

        function savePlaylist() {
            const playlistData = playlist.map(track => ({
                name: track.name,
                artist: track.artist,
                fileName: track.file.name
            }));
            localStorage.setItem('vibeMusic_playlist', JSON.stringify(playlistData));
        }

        function loadPlaylist() {
            const saved = localStorage.getItem('vibeMusic_playlist');
            if (saved) {
                const playlistData = JSON.parse(saved);
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
